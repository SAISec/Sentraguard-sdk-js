name: node-sdk-ci

on:
  push:
    paths:
      - "node-sdk/**"
  pull_request:
    paths:
      - "node-sdk/**"

defaults:
  run:
    working-directory: node-sdk

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
